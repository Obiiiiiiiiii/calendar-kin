<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kin Life Calendar</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    nav { display: flex; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid #ddd; padding-bottom: .75rem; margin-bottom: 1.5rem; }
    nav a { text-decoration: none; color: #2456a6; font-weight: 600; }
    nav form { margin-left: auto; }
    h1 { font-size: 1.4rem; }
    textarea { width: 100%; font-family: ui-monospace, monospace; font-size: .85rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #eee; }
    .flash { background: #fff8dc; border: 1px solid #e6d690; padding: .5rem .8rem; margin: .4rem 0; border-radius: 6px; }
    .ok { color: #1a7a3a; } .bad { color: #b3261e; }
    .pill { display: inline-block; background: #eef3fb; border-radius: 999px; padding: .1rem .6rem; font-size: .8rem; }
    button, .btn { background: #2456a6; color: #fff; border: 0; padding: .5rem 1rem; border-radius: 6px; cursor: pointer; font-size: .95rem; }
    button.secondary { background: #777; }
    button.danger { background: #b3261e; }
    .muted { color: #777; font-size: .9rem; }
    .card { border: 1px solid #e3e3e3; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    input[type=text], input[type=password], input[type=date] { padding: .4rem; width: 100%; max-width: 28rem; }
    label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
    ul.compact li { margin: .2rem 0; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('dashboard') }}">Home</a>
    <a href="{{ url_for('extract') }}">1 · Backstory</a>
    <a href="{{ url_for('spine') }}">2 · Spine</a>
    <a href="{{ url_for('events') }}">3 · Events</a>
    <a href="{{ url_for('settings') }}">Settings</a>
    <a href="{{ url_for('scanner') }}">Chat scanner</a>
    {% if session.get('authed') %}
    <form method="post" action="{{ url_for('logout') }}"><button class="secondary">Log out</button></form>
    {% endif %}
  </nav>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
